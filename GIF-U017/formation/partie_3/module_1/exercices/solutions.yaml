- exercise_id: f84c7a34-bbaf-4749-aa4e-20165a060a57
  reference_solution: "def padding_n_grammes(sentence, n):\n    return [\n       \
    \ \"\".join(n_grammes)\n        for n_grammes in list(\n            ngrams(\n\
    \                sentence,\n                n=n,\n                pad_left=True,\n\
    \                pad_right=True,\n                left_pad_symbol=\"<s>\",\n \
    \               right_pad_symbol=\"</s>\",\n            )\n        )\n    ]"
