- exercise_id: 214fd6db-9dcf-4bcc-aff6-a613eb6cfa91
  reference_solution: "class InceptionBlock(nn.Module):\n    def __init__(\n     \
    \   self, in_features, ch1x1, ch3x3orange, ch3x3, ch5x5jaune, ch5x5, pool_proj\n\
    \    ):\n        super().__init__()\n\n        self.conv1x1 = nn.Conv2d(in_features,\
    \ ch1x1, 1)\n\n        self.conv1x1_conv3x3 = nn.Sequential(\n            nn.Conv2d(in_features,\
    \ ch3x3orange, 1),\n            nn.Conv2d(ch3x3orange, ch3x3, 3, padding=1),\n\
    \        )  # TODO\n\n        self.conv1x1_conv5x5 = nn.Sequential(\n        \
    \    nn.Conv2d(in_features, ch5x5jaune, 1),\n            nn.Conv2d(ch5x5jaune,\
    \ ch5x5, 5, padding=2),\n        )  # TODO\n\n        self.maxPool3x3stride1_conv1x1\
    \ = nn.Sequential(\n            nn.MaxPool2d(3, stride=1, padding=1), nn.Conv2d(in_features,\
    \ pool_proj, 1)\n        )  # TODO\n\n    def forward(self, x):\n        sortie1\
    \ = self.conv1x1(x)\n        sortie2 = self.conv1x1_conv3x3(x)\n        sortie3\
    \ = self.conv1x1_conv5x5(x)\n        sortie4 = self.maxPool3x3stride1_conv1x1(x)\n\
    \        out = torch.cat((sortie1, sortie2, sortie3, sortie4), dim=1)\n      \
    \  return out\n\n\nnet = InceptionBlock(3, 5, 2, 5, 2, 5, 5)\nimage_aleatoire\
    \ = torch.rand(1, 3, 224, 224)\nout = net.forward(image_aleatoire)\nout.shape"
