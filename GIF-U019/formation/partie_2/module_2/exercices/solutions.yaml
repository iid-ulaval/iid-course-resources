- exercise_id: c8b5bfc9-5f65-48eb-b29c-f559dc0b9573
  reference_solution: "class AlexNetModifiedSansReLU(nn.Module):\n    def __init__(self,\
    \ num_classes: int = 1000) -> None:\n        super().__init__()\n        self.features\
    \ = nn.Sequential(\n            nn.Conv2d(3, 64, kernel_size=3, stride=1, padding=0),\n\
    \            nn.Conv2d(64, 64, kernel_size=3, stride=2, padding=0),\n        \
    \    nn.Conv2d(64, 64, kernel_size=3, stride=2, padding=1),\n            nn.ReLU(inplace=True),\n\
    \            nn.MaxPool2d(kernel_size=3, stride=2),\n            nn.Conv2d(64,\
    \ 192, kernel_size=3, padding=1),\n            nn.Conv2d(192, 192, kernel_size=3,\
    \ padding=1),\n            nn.ReLU(inplace=True),\n            nn.MaxPool2d(kernel_size=3,\
    \ stride=2),\n            nn.Conv2d(192, 384, kernel_size=3, padding=1),\n   \
    \         nn.ReLU(inplace=True),\n            nn.Conv2d(384, 256, kernel_size=3,\
    \ padding=1),\n            nn.ReLU(inplace=True),\n            nn.Conv2d(256,\
    \ 256, kernel_size=3, padding=1),\n            nn.ReLU(inplace=True),\n      \
    \      nn.MaxPool2d(kernel_size=3, stride=2),\n        )\n        self.avgpool\
    \ = nn.AdaptiveAvgPool2d((6, 6))\n        self.classifier = nn.Sequential(\n \
    \           nn.Dropout(),\n            nn.Linear(256 * 6 * 6, 4096),\n       \
    \     nn.ReLU(inplace=True),\n            nn.Dropout(),\n            nn.Linear(4096,\
    \ 4096),\n            nn.ReLU(inplace=True),\n            nn.Linear(4096, num_classes),\n\
    \        )\n\n    def forward(self, x: torch.Tensor) -> torch.Tensor:\n      \
    \  x = self.features(x)\n        x = self.avgpool(x)\n        x = torch.flatten(x,\
    \ 1)\n        x = self.classifier(x)\n        return x"
