    score: 1
    explanation: Effectivement, en retirant trop de neurones, le réseau va avoir de
      la difficulté à apprendre puisque trop souvent ses neurones seront retirés et
      leurs poids non ajustés. Il y a aussi le fait qu'on essaie maintenant d'entraîner
      un réseau trop petit (p. ex. avec 100 fois moins de poids) pour reproduire la
      variabilité des données d'entraînement. Il est donc important d'utiliser des
      valeurs, ni trop faibles, ni trop élevées.
