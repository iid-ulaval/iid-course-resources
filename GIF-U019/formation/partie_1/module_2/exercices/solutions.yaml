  - answer: true
    score: 0
    explanation: L'utilisation d'un sous-échantillon en phase de prototypage et de
      développement est bénéfique, car il facilite la boucle d'interaction avec nos
      hypothèses. Il est préférable de tester de nouvelles idées et architectures
      avec un nombre restreint de données pour confirmer ou infirmer notre intuition.
      Cela évite aussi de lancer inutilement des entraînements pouvant s'étirer sur
      plusieurs heures. Cela facilite également le débogage de la boucle d'entraînement.
      Toutefois, il est important de valider nos modèles les plus prometteurs sur
      l'ensemble des données disponibles (en excluant bien sûr les données de tests
      de l'entraînement).
