    explanation: Puisque les données sont ordonnées par classe, en sélectionnant les
      $n$ premières données, nous nous retrouvons à ne pas avoir toutes les classes
      dans le sous-échantillon. Il est donc important de bien construire un sous-échantillon
      en effectuant une pige aléatoire et en s'assurant que les distributions sont
      similaires entre le sous-échantillon et l'ensemble du jeu de données.
