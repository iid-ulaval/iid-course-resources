- exercise_id: 11bb4d42-b720-431b-9f7c-e30ee2d3d00a
  reference_solution: 'True'
  feedback_list:
  - answer: true
    score: 1
    explanation: En effet, après la couche GAP, chaque carte d'attributs possédant
      l'aspect spatial d'une image (deux dimensions) est condensée en un seul attribut.
      L'information spatiale est donc perdue. Il est impossible de recréer une carte
      d'attribution à partir des valeurs suivant la couche GAP. C'est pourquoi elle
      n'est pas utilisée dans cette méthode.
