    explanation: En fait, lors de la rétropropagation du gradient, on calcule la dérivée
      des poids à optimiser par rapport à la perte calculée. Dans le cas du gradient
      sur l’entrée, on doit calculer la dérivée des valeurs d’entrée par rapport à
