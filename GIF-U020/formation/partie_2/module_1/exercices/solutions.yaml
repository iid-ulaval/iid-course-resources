- exercise_id: 0964d67e-8d44-4da6-802e-249f03c0ee8e
  reference_solution: 'True'
  feedback_list:
  - answer: true
    score: 1
    explanation: En effet, lorsqu'on utilise des couches à convolution, l'image reste
      en deux dimensions. L'information sur l'espace n'est donc pas perdue. En utilisant,
      des couches pleinement connectées, l'image est transformée en une seule dimension
      et beaucoup d'information sur l'espace est perdue. Cette perte d'information
      rend la modélisation plus complexe pour les couches pleinement connectées.
