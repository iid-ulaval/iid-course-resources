  reference_solution: "tokens = nltk.word_tokenize(corpus)\ntri_grams = nltk.ngrams(corpus.split(),\
    \ 3)\nfdist = nltk.FreqDist(tri_grams)\n\n\ndef prédiction_mot(mot1, mot2):\n\
    \    tri_grams_triés = [\n        (k, v)\n        for k, v in sorted(\n      \
