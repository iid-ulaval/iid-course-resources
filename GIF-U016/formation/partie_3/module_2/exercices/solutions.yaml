- exercise_id: 6558ae70-6c3f-4d93-9653-15cd75c1900e
  reference_solution: "# taille des n-grammes\nN = 2\n\n# dictionnaire des n-grammes\n\
    n_grams = {}\n\n# découper le texte en tokens\ntokenized_data = nltk.word_tokenize(data)\n\
    \n# compter la fréquence d'apparition des bigrammes\nfor i in range(0, len(tokenized_data)\
    \ - N + 1):\n    words = tuple(tokenized_data[i : i + N])\n    n_grams[words]\
    \ = n_grams.get(words, 0) + 1\n\n# ne conserver que les bigrammes apparaissant\
    \ plus de deux fois\ndico_freq = dict(filter(lambda x: x[1] > 2, n_grams.items()))"
  feedback_list: null
