  feedback_list:
  - answer: 1
    score: 1
    explanation: En effet, un $R^2$ de 1 signifie que le modèle explique toute la
      variance de la variable d'intérêt. À l'opposé une valeur de 0 signifie que le
      modèle n'explique rien de la valeur de la variable d'intérêt. Une valeur de
      0,9 explique une grande partie de la variance, mais une petite partie reste
      inexpliquée.
